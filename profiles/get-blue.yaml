# Get Blue, used in week 1 to compare the tool's drafts with the ones Matt approves.
# Facts taken from the Get Blue project's rules and memory on 25 Oct 2026.
slug: get-blue
name: "Get Blue: A Tribute To The Fab Four"
pitch: Liverpool-based quartet playing Beatles songs reworked through jazz, soul and groove.
bio: >
  Get Blue is a chronological concert journey through songs made famous by the Fab Four, reworked
  by a Liverpool-based quartet through jazz, soul, groove and modern small-group arrangements.
  Supported and promoted by The Beatles Story.
line_up:
  - Adee Lifshitz (vocals)
  - Barry Dallman (piano)
  - Matt Lawton (bass, musical director)
  - Colin Lamont (drums)
formats: Quartet (vocals, keys, bass, drums) is the theatre offer; duo or trio only for small bars, restaurants and private events.
sender:
  name: Matt Lawton
  role: band leader
  email: mattlawtonbass@gmail.com
  phone: "07540 521225"
  signature: |
    Matt Lawton
    Get Blue: A Tribute To The Fab Four
    mattlawtonbass@gmail.com | 07540 521225
  example_subject: "Get Blue: Proposal for September 2027"
fees:
  weekend_guide: "about £800 for the quartet"
  weekday_guide: "about £600 for the quartet"
  notes: Guides only. Never quoted without Matt.
targeting:
  region: North West and North of England
  venue_types:
    - theatres
    - arts centres
    - listening rooms
    - jazz clubs
    - festivals
  avoid:
    - venues with another Beatles show booked nearby
do_not_contact:
  - Ed Green at the Harlequin Theatre, about promotion
  - Future Yard
  - LEAF (closed)
