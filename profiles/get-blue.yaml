links:
  epk: https://drive.google.com/file/d/1WnCp7s3qAaYhTSJ0IIJybUmwbldOq0U2/view
current_focus: Dates in 2027, especially September (Lakes and Lancashire coast), September to October (Yorkshire) and October to November home dates.
availability: September 2027 is good. Avoid 13 and 15 October 2027 if possible. North East weekends only for good payers.
style: |
  Open with "My name is Matt Lawton, and I lead Get Blue..."
  Title Case subject in the form "Get Blue: Proposal for September 2027".
  Formal sentences, no casual phrasing.
  Close with "I look forward to hearing from you." then "Best wishes," and the signature.
leads_per_week: 5
